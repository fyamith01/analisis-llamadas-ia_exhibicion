# Entorno para las pruebas y la CI. Los scripts siguen declarando sus
# dependencias en línea (PEP 723), así que `uv run pipeline.py` no depende de este archivo.
[project]
name = "ejemplo-auditoria-llamadas"
version = "0.1.0"
description = "Ejemplo ejecutable con datos sintéticos del pipeline de auditoría de llamadas"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "pyarrow>=16", "pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
